site_name: PlatformIO for Mere Mortals
site_description: Building firmware for boards like Arduino and ESP32 from the command line. Projects and environments in one configuration file, libraries from a registry, desktop builds and unit tests, static checks, and uploading — with the parts that need a real board labelled as such.
